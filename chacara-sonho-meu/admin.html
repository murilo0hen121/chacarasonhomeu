<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Chácara Sonho Meu</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF4E8;--alt:#F1E6D2;--ink:#253221;--mute:#6A6B55;--line:#E8DAC1;--brown:#87511A;--brown2:#6F4113;--bad:#B3261E;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Mulish,system-ui,sans-serif}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0 0 12px}
h2{font-size:30px}h3{font-size:22px;margin-top:28px}
[hidden]{display:none!important}
.box{max-width:430px;margin:10vh auto;padding:28px;background:#fff;border-radius:20px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:inherit}
textarea{min-height:90px;resize:vertical}
input[type=color]{padding:2px;height:44px;width:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--brown);background:var(--brown);color:#fff;font:700 15px Mulish,sans-serif;padding:11px 22px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--brown2)}.btn.sec{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.sec:hover{background:var(--alt)}
.btn[disabled]{opacity:.5;cursor:wait}
.lnk{background:none;border:0;padding:0;color:var(--brown);text-decoration:underline;font:inherit;cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin:8px 0 0}.mute{color:var(--mute);font-size:14px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top b{font:400 20px Marcellus,serif}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1}
#tabs button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 16px;font:700 14px Mulish,sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
#tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:22px 20px 80px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--alt);border-radius:16px;padding:16px}.kpi b{display:block;font:400 36px/1.1 Marcellus,serif}.kpi span{font-size:14px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:6px}
.bars i{flex:1;background:var(--brown);border-radius:3px 3px 0 0;min-height:2px}
.two{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.li{display:flex;justify-content:space-between;margin:0;padding:6px 0}
.ld{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ldh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ph{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start}
.ph>img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--alt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:700 14px Mulish,sans-serif;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:90%}
#toast.bad{background:var(--bad)}
</style>
</head>
<body>
<section id="cfg" class="box" hidden><h1>Falta configurar</h1><p>Abra o arquivo <b>config.js</b> e cole a URL e a chave do seu projeto Supabase (passo a passo no README).</p></section>
<section id="login" class="box" hidden>
 <h1>Painel da chácara</h1><p class="mute">Acesso restrito ao proprietário.</p>
 <form id="lf"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
 <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required>
 <p class="err" id="lmsg"></p><p><button class="btn" type="submit">Entrar</button></p></form>
 <p><button class="lnk" id="esq" type="button">Esqueci minha senha</button></p>
</section>
<section id="rec" class="box" hidden>
 <h1>Recuperar senha</h1>
 <div id="rec1"><label for="rem">E-mail do painel</label><input id="rem" type="email"><p><button class="btn" id="renv" type="button">Enviar código</button></p></div>
 <div id="rec2" hidden><p>Enviamos um código para o seu e-mail. Digite abaixo.</p><label for="rcod">Código</label><input id="rcod" inputmode="numeric" autocomplete="one-time-code"><p><button class="btn" id="rok" type="button">Confirmar código</button></p></div>
 <p class="err" id="rmsg"></p><p><button class="lnk" id="rvolta" type="button">Voltar ao login</button></p>
</section>
<section id="nova" class="box" hidden>
 <h1>Nova senha</h1><label for="n1">Nova senha (mínimo 8 caracteres)</label><input id="n1" type="password" autocomplete="new-password">
 <label for="n2">Repita a nova senha</label><input id="n2" type="password" autocomplete="new-password">
 <p class="err" id="nmsg"></p><p><button class="btn" id="nsalva" type="button">Salvar senha</button></p>
</section>
<div id="app" hidden>
 <div class="top"><div class="in"><b>Chácara Sonho Meu</b><nav id="tabs" aria-label="Seções"></nav><a class="lnk" href="index.html" target="_blank" rel="noopener">Ver site</a></div></div>
 <main id="main"></main>
</div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="defaults.js"></script>
<script>
const $=id=>document.getElementById(id);
const h=(t,a,...c)=>{const e=document.createElement(t);for(const k in(a||{})){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='value')e.value=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}c.flat(9).forEach(x=>{if(x!=null&&x!==false)e.append(x)});return e};
const clone=o=>JSON.parse(JSON.stringify(o));
const mescla=x=>{const o=clone(DEFAULTS);for(const k in x){if(Array.isArray(x[k]))o[k]=x[k];else if(x[k]&&typeof x[k]==='object')o[k]=Object.assign({},o[k],x[k])}return o};
const fd=i=>i?i.split('-').reverse().join('/'):'';
const hojeSP=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
const entre=(a,b)=>{const r=[];let d=new Date(a+'T00:00:00Z');const e=new Date((b||a)+'T00:00:00Z');while(d<=e){r.push(d.toISOString().slice(0,10));d=new Date(d.getTime()+864e5)}return r};
const NOMES={inicio:'Início',sobre:'Sobre',galeria:'Galeria',regras:'Regras'},STS=['novo','contatado','fechado','perdido'];
const CATS=[['pis','Piscinas'],['ext','Área externa'],['laz','Lazer e churrasco']];
const catSel=(v,fn)=>{const s=h('select',{onchange:fn},CATS.map(([k,n])=>h('option',{value:k},n)));s.value=v;return s};
function aviso(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(aviso.t);aviso.t=setTimeout(()=>t.hidden=true,4500)}
const view=n=>['cfg','login','rec','nova','app'].forEach(i=>$(i).hidden=i!==n);
const C=window.SB_CONFIG||{};let sb=null,D=null,recup=false,aberto=false,aba='painel',novos=0,EMAIL='';
if(!/^https:\/\/.+\.supabase\.co/.test(C.url||'')||!window.supabase){view('cfg')}else{
 sb=supabase.createClient(C.url,C.key);view('login');
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){recup=true;view('nova');return}
  if(s&&!recup&&!aberto)setTimeout(()=>abrir(s),0);if(!s){aberto=false;if(!recup)view('login')}});
}
$('lf').onsubmit=async e=>{e.preventDefault();$('lmsg').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('lmsg').textContent='E-mail ou senha incorretos.'};
$('esq').onclick=()=>{$('rem').value=$('em').value;view('rec')};$('rvolta').onclick=()=>{recup=false;view('login')};
$('renv').onclick=async()=>{const e=$('rem').value.trim();if(!e)return;$('rmsg').textContent='';const {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:false}});if(error){$('rmsg').textContent='Não foi possível enviar o código. Confira o e-mail e tente de novo em alguns minutos.';return}$('rec1').hidden=true;$('rec2').hidden=false};
$('rok').onclick=async()=>{recup=true;$('rmsg').textContent='';const {error}=await sb.auth.verifyOtp({email:$('rem').value.trim(),token:$('rcod').value.trim(),type:'email'});if(error){recup=false;$('rmsg').textContent='Código inválido ou vencido.';return}view('nova')};
$('nsalva').onclick=async()=>{const a=$('n1').value;if(a.length<8||a!==$('n2').value){$('nmsg').textContent='Use 8 ou mais caracteres, iguais nos dois campos.';return}const {error}=await sb.auth.updateUser({password:a});if(error){$('nmsg').textContent=error.message;return}recup=false;const {data}=await sb.auth.getSession();abrir(data.session)};
async function abrir(s){aberto=true;EMAIL=s.user.email;const {data:ok}=await sb.rpc('sou_admin');
 if(!ok){aberto=false;await sb.auth.signOut();view('login');$('lmsg').textContent='Este usuário não tem permissão de administrador.';return}
 try{localStorage.sm_admin='1'}catch(e){}
 const {data}=await sb.from('site_content').select('data').eq('id',1).maybeSingle();D=mescla((data&&data.data)||{});
 view('app');await contar();ir('painel');
 sb.channel('adm').on('postgres_changes',{event:'INSERT',schema:'public',table:'leads'},()=>{aviso('Novo pedido de orçamento!');contar();if(aba==='pedidos')ir('pedidos')}).subscribe()}
async function sair(){try{localStorage.removeItem('sm_admin')}catch(e){}await sb.auth.signOut();view('login')}
async function contar(){const {count}=await sb.from('leads').select('id',{count:'exact',head:true}).eq('status','novo');novos=count||0;menu()}
const TABS=[['painel','Painel'],['pedidos','Pedidos'],['fotos','Fotos'],['video','Vídeo'],['textos','Textos'],['datas','Datas'],['conta','Conta']];
function menu(){const n=$('tabs');n.textContent='';TABS.forEach(([k,t])=>n.append(h('button',{class:k===aba?'on':'',onclick:()=>ir(k)},t+(k==='pedidos'&&novos?' ('+novos+')':''))))}
function ir(k){clearInterval(painel.t);aba=k;menu();const m=$('main');m.textContent='';({painel,pedidos,fotos,video,textos,datas,conta})[k](m)}
async function salvar(b){if(b)b.disabled=true;const {error}=await sb.from('site_content').upsert({id:1,data:D,updated_at:new Date().toISOString()});if(b)b.disabled=false;aviso(error?'Erro ao salvar: '+error.message:'Salvo! O site já foi atualizado.',!!error);return !error}

async function painel(m){
 m.append(h('h2',null,'Visão geral'));const box=h('div');m.append(box);
 const {data,error}=await sb.rpc('visit_stats',{dias:30});
 if(error){box.append(h('p',{class:'err'},'Não foi possível carregar as visitas. Confira se o arquivo setup.sql foi executado.'));return}
 const mapa={};(data.por_dia||[]).forEach(d=>mapa[d.dia]=d);const ult=[];
 for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*864e5).toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});ult.push([d,(mapa[d]||{}).visitas||0])}
 const s7=ult.slice(-7).reduce((a,x)=>a+x[1],0),h0=mapa[hojeSP()]||{};
 const k=(n,t)=>h('div',{class:'kpi'},h('b',null,String(n)),h('span',null,t));
 box.append(h('div',{class:'cards'},k(data.agora||0,'online agora'),k(h0.unicos||0,'visitantes hoje'),k(h0.visitas||0,'páginas vistas hoje'),k(s7,'visualizações em 7 dias'),k(data.unicos||0,'visitantes únicos em 30 dias'),k(novos,'pedidos novos')));
 const max=Math.max(1,...ult.map(x=>x[1]));
 box.append(h('h3',null,'Visualizações por dia (30 dias)'),h('div',{class:'bars'},ult.map(([d,n])=>h('i',{style:'height:'+Math.round(n/max*100)+'%',title:fd(d)+': '+n}))));
 const lista=(t,a,nm)=>h('div',null,h('h3',null,t),(a||[]).map(p=>h('p',{class:'li'},h('span',null,(nm&&nm[p.k])||p.k),h('b',null,String(p.n)))),!(a||[]).length&&h('p',{class:'mute'},'Sem dados ainda.'));
 box.append(h('div',{class:'two'},lista('Páginas mais vistas',data.paginas,NOMES),lista('Aparelho',data.dispositivos),lista('De onde vêm',data.origens)));
 painel.t=setInterval(()=>{if(aba==='painel'&&!document.hidden){m.textContent='';painel(m)}},30000)}

async function pedidos(m){
 m.append(h('h2',null,'Pedidos de orçamento'));
 const f=h('select',{onchange:()=>lista()},h('option',{value:''},'Todos'),STS.map(s=>h('option',{value:s},s)));
 m.append(h('label',null,'Filtrar por status'),f);const L=h('div');m.append(L);
 async function lista(){L.textContent='';let q=sb.from('leads').select('*').order('created_at',{ascending:false}).limit(200);if(f.value)q=q.eq('status',f.value);
  const {data,error}=await q;if(error){L.append(h('p',{class:'err'},'Erro ao carregar os pedidos.'));return}
  if(!data.length)L.append(h('p',{class:'mute'},'Nenhum pedido por aqui ainda.'));
  data.forEach(l=>{const st=h('select',{onchange:async()=>{await sb.from('leads').update({status:st.value}).eq('id',l.id);contar()}},STS.map(s=>h('option',{value:s},s)));st.value=l.status;
   const ob=h('input',{value:l.obs||'',placeholder:'Anotações (ex.: valor combinado)',onchange:async()=>{await sb.from('leads').update({obs:ob.value}).eq('id',l.id);aviso('Anotação salva.')}});
   const per=fd(l.inicio)+(l.fim&&l.fim!==l.inicio?' a '+fd(l.fim):'');
   L.append(h('div',{class:'ld'},h('div',{class:'ldh'},h('b',null,l.nome),h('span',{class:'mute'},new Date(l.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))),
    h('p',null,'Período: '+per+' · Motivo: '+(l.motivo||'-')+' · Pessoas: '+(l.pessoas||'-')+' · Nascimento: '+fd(l.nascimento)),
    h('label',null,'Status'),st,h('label',null,'Anotações'),ob,
    h('div',{class:'row'},l.inicio&&h('button',{class:'btn sec',onclick:async()=>{const {error}=await sb.from('reserved_dates').upsert(entre(l.inicio,l.fim).map(day=>({day})));aviso(error?'Erro: '+error.message:'Datas bloqueadas no calendário do site.',!!error)}},'Bloquear estas datas'),
     h('button',{class:'btn sec',onclick:async()=>{if(confirm('Excluir este pedido?')){await sb.from('leads').delete().eq('id',l.id);lista();contar()}}},'Excluir'))))})}
 lista()}

async function fotos(m){
 m.append(h('h2',null,'Fotos da galeria'));
 const cat=catSel('ext'),st=h('p',{class:'mute'}),up=h('input',{type:'file',accept:'image/*',multiple:true});
 m.append(h('label',null,'Categoria das novas fotos'),cat,h('label',null,'Adicionar fotos'),up,st);const L=h('div',{style:'margin-top:20px'});m.append(L);let rows=[];
 async function ler(){const {data}=await sb.from('photos').select('*').order('pos').order('id');rows=data||[];desenhar()}
 async function troca(i,j){const a=rows[i],b=rows[j];if(!b)return;await Promise.all([sb.from('photos').update({pos:b.pos}).eq('id',a.id),sb.from('photos').update({pos:a.pos}).eq('id',b.id)]);ler()}
 function desenhar(){L.textContent='';if(!rows.length)L.append(h('p',{class:'mute'},'Nenhuma foto. Adicione acima.'));
  rows.forEach((p,i)=>{const alt=h('input',{value:p.alt||'','aria-label':'Descrição',onchange:async()=>{await sb.from('photos').update({alt:alt.value}).eq('id',p.id);aviso('Descrição salva.')}});
   L.append(h('div',{class:'ld ph'},h('img',{src:p.url,alt:''}),h('div',null,alt,h('div',{class:'row'},catSel(p.cat,async e=>{await sb.from('photos').update({cat:e.target.value}).eq('id',p.id);aviso('Categoria salva.')}),
    h('button',{class:'btn sec',title:'Subir',onclick:()=>troca(i,i-1)},'↑'),h('button',{class:'btn sec',title:'Descer',onclick:()=>troca(i,i+1)},'↓'),
    h('button',{class:'btn sec',onclick:async()=>{if(!confirm('Excluir esta foto do site?'))return;if(p.path)await sb.storage.from('site').remove([p.path]);await sb.from('photos').delete().eq('id',p.id);ler()}},'Excluir')))))})}
 up.onchange=async()=>{let pos=rows.length?Math.min(...rows.map(r=>r.pos)):0,n=0;
  for(const f of up.files){st.textContent='Enviando '+(++n)+' de '+up.files.length+'…';
   try{const r=await reduz(f,1600),path='fotos/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const u=await sb.storage.from('site').upload(path,r,{contentType:'image/jpeg',cacheControl:'31536000'});if(u.error)throw u.error;
    const url=sb.storage.from('site').getPublicUrl(path).data.publicUrl;
    const i=await sb.from('photos').insert({url,path,alt:'Foto da chácara',cat:cat.value,pos:--pos});if(i.error)throw i.error}
   catch(e){st.textContent='Erro no envio: '+(e.message||e);return}}
  up.value='';st.textContent='Fotos adicionadas! Já estão no site. Escreva uma descrição em cada uma.';ler()};
 ler()}
async function reduz(file,max){const b=await createImageBitmap(file),s=Math.min(1,max/b.width),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
function capa(file){return new Promise(res=>{const u=URL.createObjectURL(file),x=document.createElement('video');x.muted=true;x.playsInline=true;x.preload='auto';x.src=u;x.onloadeddata=()=>{x.currentTime=Math.min(1,(x.duration||2)/2)};x.onseeked=()=>{const c=document.createElement('canvas');c.width=540;c.height=Math.round(x.videoHeight*540/x.videoWidth);c.getContext('2d').drawImage(x,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(res,'image/jpeg',.7)};x.onerror=()=>res(null);setTimeout(()=>res(null),9000)})}

function video(m){
 m.append(h('h2',null,'Vídeo da página inicial'),h('video',{src:D.video.url,poster:D.video.poster,controls:'',playsinline:'',style:'max-width:260px;border-radius:14px;display:block'}));
 const st=h('p',{class:'mute'},'Envie um MP4 vertical de até 50 MB (o ideal é até 20 MB, para o site abrir rápido).'),up=h('input',{type:'file',accept:'video/*'});
 up.onchange=async()=>{const f=up.files[0];if(!f)return;if(f.size>50*1048576){st.textContent='Arquivo maior que 50 MB.';return}
  st.textContent='Enviando vídeo…';const id=Date.now(),p='video/'+id+'.'+((f.name.split('.').pop()||'mp4').toLowerCase());
  const r=await sb.storage.from('site').upload(p,f,{contentType:f.type||'video/mp4',cacheControl:'31536000'});if(r.error){st.textContent='Erro no envio: '+r.error.message;return}
  D.video.url=sb.storage.from('site').getPublicUrl(p).data.publicUrl;
  const cb=await capa(f);if(cb){const pp='video/'+id+'-capa.jpg',r2=await sb.storage.from('site').upload(pp,cb,{contentType:'image/jpeg'});if(!r2.error)D.video.poster=sb.storage.from('site').getPublicUrl(pp).data.publicUrl}
  if(await salvar()){ir('video')}};
 m.append(h('label',null,'Trocar vídeo'),up,st)}

function textos(m){
 const campo=(l,o,k,ta)=>[h('label',null,l),h(ta?'textarea':'input',{value:o[k]||'',oninput:e=>o[k]=e.target.value})];
 const lst=(arr,cs,novo)=>{const w=h('div');const dr=()=>{w.textContent='';arr.forEach((x,i)=>w.append(h('div',{class:'ld'},cs.map(([l,k,ta])=>campo(l,x,k,ta)),
   h('div',{class:'row'},h('button',{class:'btn sec',type:'button',onclick:()=>{if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];dr()}}},'↑'),h('button',{class:'btn sec',type:'button',onclick:()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];dr()}}},'↓'),h('button',{class:'btn sec',type:'button',onclick:()=>{arr.splice(i,1);dr()}},'Remover')))));
   w.append(h('button',{class:'btn sec',type:'button',onclick:()=>{arr.push(novo());dr()}},'+ Adicionar'))};dr();return w};
 const cor=(l,k)=>[h('label',null,l),h('input',{type:'color',value:D.cores[k],oninput:e=>D.cores[k]=e.target.value})];
 const b=h('button',{class:'btn',type:'button',onclick:()=>salvar(b)},'Salvar alterações');
 m.append(h('h2',null,'Textos e informações'),
  h('h3',null,'Página inicial'),campo('Título',D.hero,'titulo'),campo('Texto',D.hero,'texto',1),
  h('h3',null,'Ao lado do vídeo'),campo('Título',D.video,'titulo'),campo('Texto',D.video,'texto',1),

async function datas(m){
 m.append(h('h2',null,'Datas reservadas'),h('p',{class:'mute'},'Datas bloqueadas não podem ser escolhidas por quem pede orçamento.'));
 const a=h('input',{type:'date'}),b=h('input',{type:'date'}),L=h('div',{class:'chips'});
 m.append(h('label',null,'Primeiro dia'),a,h('label',null,'Último dia (vazio = um dia só)'),b,
  h('p',null,h('button',{class:'btn',onclick:async()=>{if(!a.value)return;const d=entre(a.value,b.value);if(d.length>366){aviso('Período grande demais.',1);return}const {error}=await sb.from('reserved_dates').upsert(d.map(day=>({day})));aviso(error?'Erro: '+error.message:'Datas bloqueadas.',!!error);ler()}},'Bloquear')),
  h('h3',null,'Bloqueadas a partir de hoje'),L);
 async function ler(){const {data}=await sb.from('reserved_dates').select('day').gte('day',hojeSP()).order('day');L.textContent='';
  (data||[]).forEach(r=>L.append(h('button',{class:'chip',title:'Clique para liberar',onclick:async()=>{await sb.from('reserved_dates').delete().eq('day',r.day);ler()}},fd(r.day)+' ×')));
  if(!(data||[]).length)L.append(h('span',{class:'mute'},'Nenhuma data bloqueada.'))}
 ler()}

function conta(m){
 const p1=h('input',{type:'password',autocomplete:'new-password'}),p2=h('input',{type:'password',autocomplete:'new-password'});
 m.append(h('h2',null,'Minha conta'),h('p',null,'Você entrou como ',h('b',null,EMAIL),'.'),
  h('label',null,'Nova senha (mínimo 8 caracteres)'),p1,h('label',null,'Repita a nova senha'),p2,
  h('p',null,h('button',{class:'btn',onclick:async()=>{if(p1.value.length<8||p1.value!==p2.value){aviso('Use 8 ou mais caracteres, iguais nos dois campos.',1);return}const {error}=await sb.auth.updateUser({password:p1.value});aviso(error?error.message:'Senha alterada.',!!error);if(!error)p1.value=p2.value=''}},'Alterar senha')),
  h('p',null,h('button',{class:'btn sec',onclick:sair},'Sair')))}
